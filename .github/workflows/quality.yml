name: Quality

on:
  workflow_call:

permissions:
  contents: read

jobs:
  quality:
    name: Format, lint, test, and build
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Restore Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - name: Install Rust and Tauri build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            libappindicator3-dev \
            libgtk-3-dev \
            libjavascriptcoregtk-4.1-dev \
            libvirt-dev \
            libssl-dev \
            libsoup-3.0-dev \
            libwebkit2gtk-4.1-dev \
            pkg-config

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Check TypeScript
        run: npx tsc --noEmit

      - name: Check required test suites
        run: npm run test:suites

      - name: Lint frontend
        run: npm run lint

      - name: Check project truthfulness
        run: npm run test:truthfulness

      - name: Audit JavaScript dependencies
        run: npm audit --audit-level=high

      - name: Install locked Rust audit tool
        run: cargo install cargo-audit --version 0.22.0 --locked

      - name: Audit Rust dependencies
        working-directory: src-tauri
        run: cargo audit

      - name: Run frontend tests
        run: npm test

      - name: Build frontend
        run: npm run build

      - name: Check Rust formatting
        working-directory: src-tauri
        run: cargo fmt --check

      - name: Lint Rust
        working-directory: src-tauri
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Run Rust tests
        working-directory: src-tauri
        run: cargo test --locked
